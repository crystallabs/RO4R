# Runs on a v* tag push: tests and checks that the tag matches RO4R::VERSION.
name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Test
        run: bundle exec rake test
      - name: Check the tag matches the gem version
        run: |
          v=$(ruby -Ilib -r ro4r/version -e 'print RO4R::VERSION')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
