name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Run the suite a few times: the bugs it guards against are races.
      - name: Test
        run: for i in 1 2 3; do bundle exec rake test || exit 1; done
      - name: Build gem
        run: gem build ro4r.gemspec
