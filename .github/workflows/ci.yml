name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.2', '3.3', '3.4', '4.0' ]
        os: [ ubuntu-latest ]
        # setup-ruby has no builds of Ruby before 3.2 for ubuntu-latest
        # (26.04 since October 2026); pin those to an image that has them.
        include:
          - { ruby: '2.7', os: ubuntu-24.04 }
          - { ruby: '3.0', os: ubuntu-24.04 }
          - { ruby: '3.1', os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Run the suite a few times: the bugs it guards against are races.
      - name: Test
        run: for i in 1 2 3; do bundle exec rake test || exit 1; done
      - name: Build gem
        run: gem build ro4r.gemspec
